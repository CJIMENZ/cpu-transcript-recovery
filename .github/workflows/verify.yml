name: Verify CPU transcription
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-cpu.txt
      - run: python -m pip install -r requirements-cpu.txt
      - name: Run decoder, timeline and output tests
        run: |
          python -c "from faster_whisper.audio import decode_audio"
          python -m unittest discover -v
